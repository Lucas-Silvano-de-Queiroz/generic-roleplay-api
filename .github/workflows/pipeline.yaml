name: E2E Tests

on:
  push:
    branches: [develop]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: cp .env.example .env

      - run: docker compose up -d --build

      - run: sleep 10

      - name: Status dos containers
        run: docker compose ps

      - name: Logs da API
        run: docker compose logs api

      - name: Verificar node_modules
        run: |
          docker compose exec -T api ls -la /app
          docker compose exec -T api ls -la /app/node_modules

      - run: docker compose exec -T api pnpm drizzle-kit push

      - run: docker compose exec -T api pnpm test:e2e

      - if: always()
        run: docker compose down -v
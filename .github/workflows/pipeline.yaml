name: E2E Tests

on:
  push:
    branches: [develop]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: cp .env.example .env

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm test:e2e
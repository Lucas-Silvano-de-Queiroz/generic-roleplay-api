services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gr-api
    env_file:
      - .env
    environment:
      CI: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm-store
    restart: unless-stopped

volumes:
  node_modules:
  pnpm-store:
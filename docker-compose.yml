services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gr-api
    user: "1000:1000"
    env_file:
      - .env
    environment:
      CI: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm-store:/pnpm-store
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: gr-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  localstack:
    image: localstack/localstack:2026.09.0
    container_name: gr-localstack
    profiles: ["media"]
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: s3
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      S3_VALIDATE_SIGNATURES: "1"
      S3_BUCKET: ${S3_BUCKET:-generic-roleplay-media}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/10-media.sh:ro
      - ./scripts/media-cors.json:/etc/localstack/init/ready.d/media-cors.json:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket \"$${S3_BUCKET}\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  node_modules:
  pnpm-store:
  postgres_data:
